<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flow / M-OS-R</title>

<style>
:root {
  --bg: #1b0a3b;
  --sidebar: #120836;
  --panel: #24104d;
  --panel-hover: #32166b;
  --gold: #ffb700;
  --gold-bright: #ffc933;
  --text: #fff4d0;
  --muted: #cbbd9a;
  --border: rgba(255, 183, 0, 0.35);
}

* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
  background: var(--bg);
  color: var(--text);
}

#container {
  display: flex;
  height: 100vh;
  overflow: hidden;
}

#sidebar {
  width: 340px;
  min-width: 260px;
  background: var(--sidebar);
  color: var(--gold);
  overflow-y: auto;
  padding: 1rem;
  border-right: 1px solid var(--border);
}

#sidebar h1 {
  margin-top: 0;
  font-size: 1.35rem;
  color: var(--gold);
}

#documentCount {
  color: var(--muted);
  font-size: 0.85rem;
  margin-bottom: 1rem;
}

#searchInput {
  width: 100%;
  padding: 0.75rem;
  margin-bottom: 0.75rem;
  background: var(--panel);
  color: var(--text);
  border: 1px solid var(--border);
  border-radius: 6px;
  font-size: 1rem;
}

#searchInput::placeholder {
  color: var(--muted);
}

#searchInput:focus {
  outline: 2px solid var(--gold);
}

#searchResults {
  margin-bottom: 1rem;
}

.search-result {
  display: block;
  padding: 0.7rem;
  margin-bottom: 0.5rem;
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 6px;
  color: var(--text);
  text-decoration: none;
  cursor: pointer;
}

.search-result:hover {
  background: var(--panel-hover);
}

.search-result-title {
  color: var(--gold-bright);
  font-weight: bold;
}

.search-result-path {
  color: var(--muted);
  font-size: 0.78rem;
  margin-top: 0.25rem;
}

.search-result-description {
  color: var(--text);
  font-size: 0.85rem;
  margin-top: 0.4rem;
}

.no-results {
  color: var(--muted);
  padding: 0.5rem;
}

#fileTree {
  list-style: none;
  padding: 0;
  margin: 0;
}

#fileTree ul {
  list-style: none;
  padding-left: 1rem;
}

.tree-folder {
  margin: 0.2rem 0;
}

.tree-folder-button {
  width: 100%;
  text-align: left;
  background: none;
  border: none;
  color: var(--gold);
  cursor: pointer;
  padding: 0.45rem;
  border-radius: 4px;
  font-size: 0.95rem;
}

.tree-folder-button:hover {
  background: var(--panel-hover);
}

.tree-folder-button::before {
  content: "▶ ";
  font-size: 0.7rem;
}

.tree-folder.open > .tree-folder-button::before {
  content: "▼ ";
}

.tree-children {
  display: none;
}

.tree-folder.open > .tree-children {
  display: block;
}

.tree-file {
  display: block;
  padding: 0.4rem 0.55rem;
  margin: 0.15rem 0;
  color: var(--gold);
  text-decoration: none;
  border-radius: 4px;
  cursor: pointer;
}

.tree-file:hover {
  background: var(--panel-hover);
}

.tree-file.active {
  background: var(--gold);
  color: var(--bg);
  font-weight: bold;
}

#content {
  flex: 1;
  padding: 2rem;
  overflow-y: auto;
  background: var(--bg);
  color: var(--text);
  line-height: 1.65;
}

#content h1,
#content h2,
#content h3,
#content h4,
#content h5,
#content h6 {
  color: var(--gold);
}

#content a {
  color: var(--gold-bright);
}

#content blockquote {
  border-left: 4px solid var(--gold);
  padding-left: 1rem;
  color: var(--muted);
}

#content pre,
#content code {
  background: var(--panel);
  color: var(--gold-bright);
  padding: 0.2rem 0.4rem;
  border-radius: 4px;
}

#content pre {
  padding: 1rem;
  overflow-x: auto;
}

.status-error {
  color: #ffb4b4;
  background: rgba(120, 0, 0, 0.25);
  border: 1px solid rgba(255, 120, 120, 0.35);
  padding: 1rem;
  border-radius: 8px;
}

@media (max-width: 800px) {
  #container {
    flex-direction: column;
  }

  #sidebar {
    width: 100%;
    min-width: 0;
    height: 45vh;
    border-right: none;
    border-bottom: 1px solid var(--border);
  }

  #content {
    height: 55vh;
    padding: 1rem;
  }
}
</style>
</head>

<body>

<div id="container">

  <aside id="sidebar">

    <h1>🌊 Flow / M-OS-R</h1>

    <div id="documentCount">
      Läser GitHub-repot...
    </div>

    <input
      type="search"
      id="searchInput"
      placeholder="🔍 Sök i hela Flow..."
      autocomplete="off"
    >

    <div id="searchResults"></div>

    <ul id="fileTree"></ul>

  </aside>

  <main id="content">
    Läser dokument från GitHub...
  </main>

</div>

<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

<script>

const OWNER = "ExistensialReset";
const REPO = "flowmosr";
const BRANCH = "main";

const GITHUB_TREE_API =
  `https://api.github.com/repos/${OWNER}/${REPO}/git/trees/${BRANCH}?recursive=1`;

const RAW_BASE =
  `https://raw.githubusercontent.com/${OWNER}/${REPO}/${BRANCH}/`;

let pages = [];

const content = document.getElementById("content");
const fileTree = document.getElementById("fileTree");
const searchInput = document.getElementById("searchInput");
const searchResults = document.getElementById("searchResults");
const documentCount = document.getElementById("documentCount");

function normalize(text) {
  return String(text || "")
    .toLowerCase()
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g, "");
}

function escapeHtml(text) {
  return String(text || "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}

function titleFromMarkdown(path, markdown) {

  const match = markdown.match(/^#\s+(.+)$/m);

  if (match) {
    return match[1].trim();
  }

  const filename =
    path
      .split("/")
      .pop()
      .replace(/\.md$/i, "");

  return filename.replace(/[_-]+/g, " ");
}

function descriptionFromMarkdown(markdown) {

  const cleaned = markdown
    .replace(/^---[\s\S]*?---/m, "")
    .replace(/^#+\s+.*$/gm, "")
    .replace(/[*_`>#-]/g, " ")
    .replace(/\s+/g, " ")
    .trim();

  return cleaned.slice(0, 300);
}

function rawUrl(path) {

  return RAW_BASE +
    path
      .split("/")
      .map(encodeURIComponent)
      .join("/");
}

async function loadRepository() {

  documentCount.textContent =
    "Läser GitHub-repot...";

  content.innerHTML =
    "<p>Hämtar dokumentstrukturen från GitHub...</p>";

  try {

    const response =
      await fetch(GITHUB_TREE_API);

    if (!response.ok) {
      throw new Error(
        `GitHub API error: ${response.status}`
      );
    }

    const data =
      await response.json();

    const markdownFiles =
      data.tree
        .filter(item =>
          item.type === "blob" &&
          item.path.toLowerCase().endsWith(".md")
        )
        .map(item => item.path)
        .sort((a, b) => a.localeCompare(b));

    documentCount.textContent =
      `${markdownFiles.length} dokument hittade — indexerar...`;

    const BATCH_SIZE = 20;

    for (
      let i = 0;
      i < markdownFiles.length;
      i += BATCH_SIZE
    ) {

      const batch =
        markdownFiles.slice(i, i + BATCH_SIZE);

      const results =
        await Promise.all(

          batch.map(async path => {

            try {

              const response =
                await fetch(rawUrl(path));

              if (!response.ok) {
                return null;
              }

              const markdown =
                await response.text();

              return {

                title:
                  titleFromMarkdown(
                    path,
                    markdown
                  ),

                path,

                description:
                  descriptionFromMarkdown(
                    markdown
                  ),

                content:
                  markdown

              };

            } catch (error) {

              console.warn(
                "Kunde inte läsa:",
                path,
                error
              );

              return null;
            }

          })

        );

      pages.push(
        ...results.filter(Boolean)
      );

      documentCount.textContent =
        `${pages.length} av ${markdownFiles.length} dokument indexerade...`;
    }

    documentCount.textContent =
      `${pages.length} dokument indexerade`;

    buildNavigation();

    loadMarkdown("README.md");

  } catch (error) {

    console.error(error);

    documentCount.textContent =
      "Kunde inte läsa GitHub-repot.";

    content.innerHTML = `

      <div class="status-error">

        <h1>Kunde inte läsa Flow-repot</h1>

        <p>
          ${escapeHtml(error.message)}
        </p>

        <p>
          Kontrollera att repo:t är publikt
          och att GitHub är tillgängligt.
        </p>

      </div>

    `;
  }
}

function buildNavigation() {

  fileTree.innerHTML = "";

  const root = {};

  pages.forEach(page => {

    const parts =
      page.path.split("/");

    let current = root;

    parts.forEach((part, index) => {

      const isFile =
        index === parts.length - 1;

      if (!current[part]) {

        current[part] = {

          __file: null,

          __children: {}

        };
      }

      if (isFile) {

        current[part].__file =
          page;
      }

      current =
        current[part].__children;

    });

  });

  renderTree(root, fileTree);
}

function renderTree(tree, parentElement) {

  const entries =
    Object.entries(tree);

  entries.sort((a, b) => {

    const aFolder =
      Object.keys(a[1].__children).length > 0;

    const bFolder =
      Object.keys(b[1].__children).length > 0;

    if (aFolder !== bFolder) {

      return aFolder ? -1 : 1;
    }

    return a[0].localeCompare(b[0]);

  });

  entries.forEach(([name, node]) => {

    const hasChildren =
      Object.keys(node.__children).length > 0;

    const hasFile =
      node.__file !== null;

    if (hasChildren) {

      const li =
        document.createElement("li");

      li.className =
        "tree-folder";

      const button =
        document.createElement("button");

      button.className =
        "tree-folder-button";

      button.textContent =
        name;

      const children =
        document.createElement("ul");

      children.className =
        "tree-children";

      li.appendChild(button);

      li.appendChild(children);

      parentElement.appendChild(li);

      button.addEventListener(
        "click",
        () => {

          li.classList.toggle("open");

        }
      );

      renderTree(
        node.__children,
        children
      );

      if (hasFile) {

        children.insertBefore(

          createFileLink(
            node.__file
          ),

          children.firstChild

        );
      }

    } else if (hasFile) {

      parentElement.appendChild(

        createFileLink(
          node.__file
        )

      );
    }

  });
}

function createFileLink(page) {

  const link =
    document.createElement("a");

  link.className =
    "tree-file";

  link.textContent =
    page.title || page.path;

  link.href =
    "#";

  link.addEventListener(
    "click",
    event => {

      event.preventDefault();

      document
        .querySelectorAll(".tree-file")
        .forEach(element =>
          element.classList.remove("active")
        );

      link.classList.add("active");

      loadMarkdown(
        page.path
      );

    }
  );

  return link;
}

async function loadMarkdown(path) {

  content.innerHTML =
    "<p>Laddar dokument...</p>";

  try {

    const page =
      pages.find(
        p => p.path === path
      );

    if (page && page.content) {

      content.innerHTML =
        marked.parse(
          page.content
        );

      return;
    }

    const response =
      await fetch(
        rawUrl(path)
      );

    if (!response.ok) {

      throw new Error(
        `Kunde inte ladda ${path}`
      );
    }

    const markdown =
      await response.text();

    content.innerHTML =
      marked.parse(markdown);

  } catch (error) {

    content.innerHTML = `

      <div class="status-error">

        <h1>
          Kunde inte ladda dokumentet
        </h1>

        <p>
          ${escapeHtml(path)}
        </p>

      </div>

    `;
  }
}

function searchPages(query) {

  const normalizedQuery =
    normalize(
      query.trim()
    );

  if (!normalizedQuery) {

    searchResults.innerHTML =
      "";

    return;
  }

  const queryWords =
    normalizedQuery
      .split(/\s+/)
      .filter(Boolean);

  const results =

    pages

      .map(page => {

        const title =
          normalize(page.title);

        const path =
          normalize(page.path);

        const description =
          normalize(page.description);

        const pageContent =
          normalize(page.content);

        let score =
          0;

        let matchedWords =
          0;

        queryWords.forEach(word => {

          let matched =
            false;

          if (title.includes(word)) {

            score += 100;

            matched = true;
          }

          if (path.includes(word)) {

            score += 40;

            matched = true;
          }

          if (description.includes(word)) {

            score += 30;

            matched = true;
          }

          if (pageContent.includes(word)) {

            score += 10;

            matched = true;
          }

          if (matched) {

            matchedWords++;
          }

        });

        if (
          matchedWords ===
          queryWords.length
        ) {

          score += 100;
        }

        return {

          page,

          score

        };

      })

      .filter(
        result => result.score > 0
      )

      .sort(
        (a, b) =>
          b.score - a.score
      )

      .slice(0, 100);

  renderSearchResults(results);
}

function renderSearchResults(results) {

  searchResults.innerHTML =
    "";

  if (
    results.length === 0
  ) {

    searchResults.innerHTML =
      `<div class="no-results">
        Inga dokument hittades.
      </div>`;

    return;
  }

  results.forEach(result => {

    const page =
      result.page;

    const link =
      document.createElement("a");

    link.className =
      "search-result";

    link.href =
      "#";

    link.innerHTML = `

      <div class="search-result-title">

        ${escapeHtml(page.title)}

      </div>

      <div class="search-result-path">

        ${escapeHtml(page.path)}

      </div>

      <div class="search-result-description">

        ${escapeHtml(page.description)}

      </div>

    `;

    link.addEventListener(
      "click",
      event => {

        event.preventDefault();

        loadMarkdown(
          page.path
        );

        searchInput.value =
          "";

        searchResults.innerHTML =
          "";

      }
    );

    searchResults.appendChild(
      link
    );

  });
}

searchInput.addEventListener(
  "input",
  event => {

    searchPages(
      event.target.value
    );

  }
);

loadRepository();

</script>

</body>
</html>
